name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  story-lint:
    # UNIVERSAL_PROTOCOL.md section 7: CI refuses a PR whose branch and title
    # disagree, or whose id is not in the plan. A convention nobody enforces
    # drifts within a single milestone.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Branch and title must name the same story
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -u
          if ! printf '%s' "$BRANCH" | grep -Eq '^feat/m[0-9]+-s[0-9]+(\.[0-9]+)?-[a-z0-9-]+$'; then
            echo "::error::branch '$BRANCH' is not feat/m<M>-s<S>-<slug>"
            exit 1
          fi
          id_from_branch=$(printf '%s' "$BRANCH" | sed -E 's|^feat/(m[0-9]+-s[0-9]+(\.[0-9]+)?)-.*$|\1|' | tr 'a-z' 'A-Z')
          if ! printf '%s' "$TITLE" | grep -Eq "^${id_from_branch}: .+"; then
            echo "::error::PR title '$TITLE' does not start with '${id_from_branch}: '"
            exit 1
          fi
          echo "story-lint OK: $id_from_branch"

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every tracked path is declared
        run: python tools/check_layout.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Kaggle's notebook image runs; 3.12 is the local
        # development target. The package has to work under both, so both are
        # tested rather than assumed.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  lowest-versions:
    # The dependency FLOOR, not the ceiling.
    #
    # pyproject declares `scikit-learn>=1.5`. CI resolved the newest in range
    # and every test passed on 1.7.2 - while the code used `quantile_method`,
    # which only exists from 1.7. Kaggle's image sits below that, pip was
    # already satisfied so it installed nothing newer, and the PUBLISHED kernel
    # was where we found out.
    #
    # `--resolution lowest-direct` installs the oldest version each declared
    # bound allows. If the floor is wrong, this job is where it fails - not a
    # reader's notebook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Resolve the lowest permitted versions
        run: uv sync --dev --resolution lowest-direct --python 3.11
      # `--no-sync` on every run step, or `uv run` silently re-resolves to the
      # HIGHEST versions and this job tests the ceiling while claiming to test
      # the floor - the same class of defect it exists to catch.
      - name: Show what that resolved to
        run: uv run --no-sync --python 3.11 python -c "import sklearn, pandas, numpy, lightgbm, xgboost; print('sklearn', sklearn.__version__, '| pandas', pandas.__version__, '| numpy', numpy.__version__, '| lgbm', lightgbm.__version__, '| xgb', xgboost.__version__)"
      - name: Run tests against the floor
        run: uv run --no-sync --python 3.11 pytest -q

  notebook:
    # The notebook is a BUILD OUTPUT of tools/build_notebook.py. Committing it
    # is deliberate - Kaggle needs a file to push and GitHub renders it - but a
    # committed build output drifts from its generator the first time somebody
    # edits the .ipynb directly. This job is what stops that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: The committed notebook matches its generator
        run: |
          uv run python tools/build_notebook.py
          git diff --exit-code notebooks/             || (echo "::error::notebooks/ is stale - rerun tools/build_notebook.py" && exit 1)
